<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ThumbForge Pro - YouTube Kapak Oluşturucu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Bebas+Neue&family=Black+Ops+One&family=Cinzel:wght@900&family=Creepster&family=Fredoka:wght@700&family=Lobster&family=Luckiest+Guy&family=Monoton&family=Montserrat:wght@900&family=Oswald:wght@700&family=Pacifico&family=Permanent+Marker&family=Poppins:wght@700;900&family=Press+Start+2P&family=Righteous&family=Rubik+Glitch&family=Titan+One&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #0b0f19; color: #f8fafc; touch-action: manipulation; }
        .canvas-bg {
            background-color: #1e293b;
            background-image: radial-gradient(#334155 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 6px; }
        /* Mobilde tuval dışındaki alanlarda scroll kilitlenmesini çözen kural */
        .canvas-container { margin: 0 auto !important; touch-action: pan-y !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row overflow-x-hidden bg-slate-950">

    <!-- SOL KONTROL PANELDİ -->
    <aside class="w-full md:w-[460px] bg-slate-900 border-r border-slate-800 flex flex-col shrink-0 z-20 shadow-2xl">
        
        <!-- Header -->
        <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-950">
            <h1 class="text-xl font-black tracking-wider text-red-500 flex items-center gap-2">
                <i class="fa-solid fa-fire text-orange-500"></i> ThumbForge Pro
            </h1>
            <span class="px-3 py-1 text-xs font-bold rounded-md bg-red-600/20 text-red-400 border border-red-500/30">16:9 Standart</span>
        </div>

        <!-- Menü Sekmeleri -->
        <div class="flex border-b border-slate-800 bg-slate-950 text-xs font-bold overflow-x-auto no-scrollbar">
            <button onclick="switchTab('ai')" id="tab-ai" class="flex-1 py-3.5 px-3 border-b-2 border-red-500 text-red-500 flex items-center justify-center gap-1.5 whitespace-nowrap"><i class="fa-solid fa-robot"></i> AI & Random</button>
            <button onclick="switchTab('text')" id="tab-text" class="flex-1 py-3.5 px-3 border-b-2 border-transparent text-slate-400 hover:text-white flex items-center justify-center gap-1.5 whitespace-nowrap"><i class="fa-solid fa-font"></i> Metin Editorü</button>
            <button onclick="switchTab('image')" id="tab-image" class="flex-1 py-3.5 px-3 border-b-2 border-transparent text-slate-400 hover:text-white flex items-center justify-center gap-1.5 whitespace-nowrap"><i class="fa-solid fa-image"></i> Görsel/Galeri</button>
            <button onclick="switchTab('templates')" id="tab-templates" class="flex-1 py-3.5 px-3 border-b-2 border-transparent text-slate-400 hover:text-white flex items-center justify-center gap-1.5 whitespace-nowrap"><i class="fa-solid fa-layer-group"></i> 30 Şablon</button>
        </div>

        <!-- Sekme İçerikleri -->
        <div class="p-4 space-y-4 text-xs overflow-y-auto max-h-[calc(100vh-140px)] no-scrollbar">
            
            <!-- 1. AI & RASTGELE SEKMESİ -->
            <div id="sec-ai" class="space-y-4">
                <div class="bg-slate-800/80 p-3.5 rounded-xl border border-slate-700 space-y-2.5">
                    <label class="font-bold text-slate-200 flex items-center gap-2"><i class="fa-solid fa-wand-magic-sparkles text-red-400"></i> Akıllı AI Prompt & Araştırma Motoru</label>
                    <textarea id="aiPrompt" rows="2" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-red-500" placeholder="Örn: Spider-Man, GTA 6, Uzayda Savaş, Cyberpunk..."></textarea>
                    
                    <div class="flex items-center gap-2 bg-slate-950 p-2 rounded-lg border border-slate-800">
                        <input type="checkbox" id="aiResearchCheck" checked class="accent-red-500 w-4 h-4 cursor-pointer">
                        <label for="aiResearchCheck" class="text-[11px] text-slate-300 font-medium cursor-pointer">Google/Web araması ile karakter, atmosfer ve görsel detayları AI promptuna otomatik ekle</label>
                    </div>

                    <select id="aiStyle" class="bg-slate-950 border border-slate-700 rounded-lg p-2 text-slate-300 w-full font-semibold">
                        <option value="photorealistic 8k, cinematic youtube thumbnail background, highly detailed">Sinematik / Gerçekçi</option>
                        <option value="cyberpunk sci-fi space aesthetic, neon glow, futuristic background">Uzay & Cyberpunk</option>
                        <option value="vibrant anime studio ghibli style background, detailed art">Anime & Çizim</option>
                        <option value="3d unreal engine 5 render, epic gaming background">3D Oyun / Render</option>
                    </select>

                    <button onclick="generateAIImage()" id="btnGenerateAI" class="w-full bg-gradient-to-r from-red-600 to-orange-600 hover:from-red-500 hover:to-orange-500 py-3 rounded-lg font-black text-white shadow-lg flex items-center justify-center gap-2">
                        <i class="fa-solid fa-bolt"></i> Bilgi Araştır & AI Arka Plan Üret
                    </button>
                </div>

                <div class="bg-slate-800/50 p-3.5 rounded-xl border border-slate-700 space-y-2">
                    <button onclick="generateRandomThumbnail()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3.5 rounded-xl font-black text-sm flex items-center justify-center gap-2 shadow-lg transition">
                        <i class="fa-solid fa-dice"></i> 🎲 100 KELİMELİK RASTGELE KAPAK OLUŞTUR
                    </button>
                    <p class="text-[11px] text-slate-400 text-center">100 farklı popüler kelime ve uyumlu HD arka plan kombinasyonlarıyla dinamik kapak üretir.</p>
                </div>
            </div>

            <!-- 2. METİN SEKMESİ -->
            <div id="sec-text" class="hidden space-y-4">
                <div class="flex gap-2">
                    <button onclick="addText()" class="flex-1 bg-red-600 hover:bg-red-500 text-white py-2.5 rounded-lg font-bold flex items-center justify-center gap-2 shadow">
                        <i class="fa-solid fa-plus"></i> Yeni Metin Ekle
                    </button>
                    <button onclick="deselectObject()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2.5 rounded-lg font-bold" title="Seçimi Kaldır">
                        <i class="fa-solid fa-arrow-pointer"></i> Seçimden Çık
                    </button>
                </div>

                <div class="space-y-3 bg-slate-800/60 p-3.5 rounded-xl border border-slate-700">
                    <span class="font-bold text-slate-300 block border-b border-slate-700 pb-1.5"><i class="fa-solid fa-sliders"></i> Metin & Konum Düzenleyici</span>
                    
                    <div>
                        <label class="text-[11px] font-bold text-slate-400 block mb-1">Yazı Tipi (18 Yeni Tip Font)</label>
                        <select id="fontFamily" onchange="updateTextProperty('fontFamily', this.value)" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 font-bold text-white">
                            <option value="Anton">Anton (Bold/Gaming)</option>
                            <option value="Bebas Neue">Bebas Neue (YouTube Klasik)</option>
                            <option value="Montserrat">Montserrat (Kalın/Modern)</option>
                            <option value="Press Start 2P">Press Start 2P (Pixel/Retro)</option>
                            <option value="Righteous">Righteous (Fütüristik)</option>
                            <option value="Fredoka">Fredoka (Yuvarlak/Sevimli)</option>
                            <option value="Monoton">Monoton (Neon/Çizgili)</option>
                            <option value="Cinzel">Cinzel (Epik/Mitolojik)</option>
                            <option value="Rubik Glitch">Rubik Glitch (Glitch/Bozuk)</option>
                            <option value="Creepster">Creepster (Korku/Cadılar)</option>
                            <option value="Luckiest Guy">Luckiest Guy (Çizgi Film)</option>
                            <option value="Black Ops One">Black Ops One (Askeri/FPS)</option>
                            <option value="Titan One">Titan One (Dev/Kabartma)</option>
                            <option value="Bangers">Bangers (Çizgi Roman)</option>
                            <option value="Pacifico">Pacifico (Kursif/El Yazısı)</option>
                            <option value="Permanent Marker">Permanent Marker (Grafiti)</option>
                            <option value="Lobster">Lobster (Süslü Kursif)</option>
                            <option value="Oswald">Oswald (Dik/Keskin)</option>
                        </select>
                    </div>

                    <!-- Boyut Slider -->
                    <div>
                        <div class="flex justify-between text-[11px] font-bold text-slate-400 mb-1">
                            <span>Metin Boyutu / Ölçek</span>
                            <span id="fontSizeVal">80px</span>
                        </div>
                        <input type="range" id="fontSizeSlider" min="20" max="220" value="80" oninput="document.getElementById('fontSizeVal').innerText=this.value+'px'; updateTextProperty('fontSize', parseInt(this.value))" class="w-full">
                    </div>

                    <!-- Harf Arası Boşluk -->
                    <div>
                        <div class="flex justify-between text-[11px] font-bold text-slate-400 mb-1">
                            <span>Harf Arası Aralık</span>
                            <span id="charSpacingVal">0</span>
                        </div>
                        <input type="range" id="charSpacingSlider" min="-50" max="300" value="0" oninput="document.getElementById('charSpacingVal').innerText=this.value; updateTextProperty('charSpacing', parseInt(this.value))" class="w-full">
                    </div>

                    <!-- Konum Hizalama Butonları -->
                    <div>
                        <label class="text-[11px] font-bold text-slate-400 block mb-1">Hızlı Konumlandırma</label>
                        <div class="grid grid-cols-5 gap-1">
                            <button onclick="moveText('left')" class="bg-slate-950 border border-slate-700 p-2 rounded hover:bg-slate-800"><i class="fa-solid fa-arrow-left"></i></button>
                            <button onclick="moveText('up')" class="bg-slate-950 border border-slate-700 p-2 rounded hover:bg-slate-800"><i class="fa-solid fa-arrow-up"></i></button>
                            <button onclick="moveText('center')" class="bg-slate-950 border border-slate-700 p-2 rounded hover:bg-slate-800 font-bold">Ortala</button>
                            <button onclick="moveText('down')" class="bg-slate-950 border border-slate-700 p-2 rounded hover:bg-slate-800"><i class="fa-solid fa-arrow-down"></i></button>
                            <button onclick="moveText('right')" class="bg-slate-950 border border-slate-700 p-2 rounded hover:bg-slate-800"><i class="fa-solid fa-arrow-right"></i></button>
                        </div>
                    </div>

                    <div class="flex gap-1.5">
                        <button onclick="toggleStyle('bold')" class="flex-1 bg-slate-950 border border-slate-700 py-2 rounded font-black hover:bg-slate-800">B</button>
                        <button onclick="toggleStyle('italic')" class="flex-1 bg-slate-950 border border-slate-700 py-2 rounded italic hover:bg-slate-800">I</button>
                        <button onclick="toggleStyle('underline')" class="flex-1 bg-slate-950 border border-slate-700 py-2 rounded underline hover:bg-slate-800">U</button>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 block mb-1">Yazı Rengi</label>
                            <input type="color" id="textColor" onchange="updateTextProperty('fill', this.value)" value="#ffffff" class="w-full h-9 bg-slate-950 border border-slate-700 cursor-pointer rounded">
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 block mb-1">Arka Plan Rengi</label>
                            <input type="color" id="textBgColor" onchange="updateTextProperty('textBackgroundColor', this.value)" value="#000000" class="w-full h-9 bg-slate-950 border border-slate-700 cursor-pointer rounded">
                        </div>
                    </div>

                    <div class="space-y-2 pt-2 border-t border-slate-700">
                        <div class="flex items-center justify-between">
                            <label class="text-[11px] font-bold text-slate-400">Dış Çizgi (Stroke)</label>
                            <input type="color" id="strokeColor" onchange="updateTextProperty('stroke', this.value)" value="#000000" class="w-7 h-7 bg-transparent cursor-pointer rounded">
                        </div>
                        <div>
                            <div class="flex justify-between text-[10px] font-bold text-slate-400 mb-1">
                                <span>Çizgi Kalınlığı</span>
                                <span id="strokeWidthVal">3</span>
                            </div>
                            <input type="range" id="strokeWidthSlider" min="0" max="20" value="3" oninput="document.getElementById('strokeWidthVal').innerText=this.value; updateTextProperty('strokeWidth', parseInt(this.value))" class="w-full">
                        </div>
                    </div>

                    <!-- Neon / Gölge Efekti -->
                    <div class="pt-2 border-t border-slate-700 space-y-1.5">
                        <label class="text-[11px] font-bold text-slate-400 block">Metin Glow / Gölge Efekti</label>
                        <div class="flex gap-2">
                            <button onclick="applyGlow('#ff0055')" class="flex-1 bg-red-950 border border-red-800 text-red-300 py-1.5 rounded font-bold">Kırmızı Glow</button>
                            <button onclick="applyGlow('#00e5ff')" class="flex-1 bg-cyan-950 border border-cyan-800 text-cyan-300 py-1.5 rounded font-bold">Mavi Glow</button>
                            <button onclick="applyGlow(null)" class="bg-slate-950 border border-slate-700 px-2 rounded text-slate-400">Kaldır</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 3. GÖRSEL & ARKA PLAN SEKMESİ -->
            <div id="sec-image" class="hidden space-y-4">
                <div class="bg-slate-800/60 p-3.5 rounded-xl border border-slate-700 space-y-3">
                    <span class="font-bold text-slate-300 block border-b border-slate-700 pb-2"><i class="fa-solid fa-mobile-screen"></i> Cihaz Galerisinden Fotoğraf Ekle</span>
                    
                    <!-- BİREBİR EŞİTLENMİŞ BUTONLAR -->
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <input type="file" id="bgLoader" accept="image/*" class="hidden" onchange="handleImageUpload(event, 'bg')">
                            <label for="bgLoader" class="flex flex-col items-center justify-center p-3.5 bg-slate-950 hover:bg-slate-800 border border-slate-700 hover:border-red-500 rounded-xl cursor-pointer h-24 transition">
                                <i class="fa-solid fa-wallpaper text-2xl text-red-500 mb-1.5"></i>
                                <span class="text-xs font-bold text-slate-200">Arka Plan Yap</span>
                            </label>
                        </div>
                        <div>
                            <input type="file" id="overlayLoader" accept="image/*" class="hidden" onchange="handleImageUpload(event, 'overlay')">
                            <label for="overlayLoader" class="flex flex-col items-center justify-center p-3.5 bg-slate-950 hover:bg-slate-800 border border-slate-700 hover:border-blue-500 rounded-xl cursor-pointer h-24 transition">
                                <i class="fa-solid fa-layer-group text-2xl text-blue-500 mb-1.5"></i>
                                <span class="text-xs font-bold text-slate-200">Üst Katman Ekle</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="font-bold text-slate-300 block mb-2"><i class="fa-solid fa-images"></i> HD Hazır Arka Plan Galerisi</label>
                    <div id="bgGalleryGrid" class="grid grid-cols-2 gap-2 max-h-60 overflow-y-auto no-scrollbar">
                        <!-- JS Tarafından Yüklenecek -->
                    </div>
                </div>
            </div>

            <!-- 4. ŞABLONLAR SEKMESİ (30 ADET ARKA PLANLI) -->
            <div id="sec-templates" class="hidden space-y-3">
                <span class="font-bold text-slate-300 block"><i class="fa-solid fa-border-all"></i> 30 Adet Arka Planlı Şablon</span>
                <div id="templatesGrid" class="grid grid-cols-2 gap-2 max-h-96 overflow-y-auto no-scrollbar">
                    <!-- 30 Şablon JavaScript tarafında üretilir -->
                </div>
            </div>

        </div>

        <!-- Alt İndirme Barı -->
        <div class="p-4 border-t border-slate-800 bg-slate-950 flex gap-2">
            <button onclick="deleteActiveObject()" class="bg-red-950 border border-red-800 text-red-400 p-3 rounded-lg font-bold hover:bg-red-900" title="Seçileni Sil">
                <i class="fa-solid fa-trash"></i>
            </button>
            <button onclick="downloadThumbnail()" class="flex-1 bg-red-600 hover:bg-red-500 text-white font-black py-3 rounded-lg text-xs flex items-center justify-center gap-2 shadow-lg">
                <i class="fa-solid fa-download"></i> KAPAĞI YÜKSEK KALİTEDE İNDİR (HD)
            </button>
        </div>
    </aside>

    <!-- SAĞ/ORTA ÇALIŞMA ALANI (CANVAS) -->
    <main class="flex-1 canvas-bg p-4 relative flex items-center justify-center min-h-[65vh] md:min-h-screen overflow-y-auto">
        <div id="canvasParent" class="shadow-2xl border-2 border-slate-700 rounded-xl overflow-hidden flex items-center justify-center bg-black">
            <canvas id="c"></canvas>
        </div>
    </main>

    <!-- SCRIPT ENGINE -->
    <script>
        let canvas;
        const TARGET_DIM = { width: 1280, height: 720 }; // Sabit 16:9 HD

        // 100 Kelimelik Rastgele Havuz
        const RANDOM_WORDS = [

        // HD Arka Plan Havuzu
        const HD_BACKGROUNDS = [
            "https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?w=1280", // Uzay Galaksi
            "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1280",

            "https://images.unsplash.com/photo-1534447677768-be436bb09401?w=1280"
        ];

        // 30 Tamamı Arka Planlı Şablon Verisi
        const TEMPLATES_DATA = [
            { name: "Uzay / Galaxy", bg: "https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?w=1280", text: "DERİNLİKLERDE!", font: "Cinzel", color: "#38bdf8" },
            { name: "Gaming / FPS", bg: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=1280", text: "EFSANE MAÇ!", font: "Black Ops One", color: "#ef4444" },
            { name: "Cyberpunk Neon", bg: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=1280", text: "2077 GELECEK", font: "Rubik Glitch", color: "#22c55e" },
            { name: "Korku / Gece", bg: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=1280", text: "GECE 03:00...", font: "Creepster", color: "#dc2626" },

            { name: "Teknoloji", bg: "https://images.unsplash.com/photo-1511512578047-dfb367046420?w=1280", text: "SATIN ALDIM!", font: "Montserrat", color: "#38bdf8" },

            { name: "Futbol / Maç", bg: "https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=1280", text: "DEV DERBİ!", font: "Bebas Neue", color: "#facc15" },
            { name: "Yazılım / Kod", bg: "https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=1280", text: "PYTHON 2026", font: "Righteous", color: "#60a5fa" },
            { name: "Çizgi Film", bg: "https://images.unsplash.com/photo-1534447677768-be436bb09401?w=1280", text: "ÇILGIN MACERA", font: "Luckiest Guy", color: "#fde047" },

            { name: "Moda / Style", bg: "https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=1280", text: "YENİ TARZIN", font: "Montserrat", color: "#ffffff" },
            { name: "Minimalist", bg: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1280", text: "SADECE İZLE.", font: "Montserrat", color: "#a1a1aa" }
        ];

        window.onload = function() {
            initCanvas();
            renderBgGallery();
            render30Templates();
            window.addEventListener('resize', resizeCanvasContainer);
        };

        function initCanvas() {
            canvas = new fabric.Canvas('c', {
                width: TARGET_DIM.width,
                height: TARGET_DIM.height,
                backgroundColor: '#0f172a',
                preserveObjectStacking: true,
                allowTouchScrolling: true // Mobil kaydırmayı kilitlenmekten kurtarır
            });

            // Seçim Değiştiğinde Sol Paneli Otomatik Güncelleme
            canvas.on('selection:created', syncUIFromSelection);
            canvas.on('selection:updated', syncUIFromSelection);

            // Boşluğa Tıklanınca Seçimden Çık
            canvas.on('mouse:down', function(e) {
                if (!e.target) {
                    canvas.discardActiveObject();
                    canvas.renderAll();
                }
            });

            loadTemplate(1); // Varsayılan Uzay Şablonu
            resizeCanvasContainer();
        }

        function resizeCanvasContainer() {
            const wrapper = document.querySelector('main');
            const maxWidth = wrapper.clientWidth - 32;
            const maxHeight = wrapper.clientHeight - 32;

            const scale = Math.min(maxWidth / TARGET_DIM.width, maxHeight / TARGET_DIM.height);

            canvas.setDimensions({
                width: TARGET_DIM.width * scale,
                height: TARGET_DIM.height * scale
            });

            canvas.setZoom(scale);
        }

        function switchTab(tabName) {
            ['ai', 'text', 'image', 'templates'].forEach(t => {
                document.getElementById(`sec-${t}`).classList.add('hidden');
                const btn = document.getElementById(`tab-${t}`);
                btn.classList.remove('border-red-500', 'text-red-500');
                btn.classList.add('border-transparent', 'text-slate-400');
            });

            document.getElementById(`sec-${tabName}`).classList.remove('hidden');
            const activeBtn = document.getElementById(`tab-${tabName}`);
            activeBtn.classList.remove('border-transparent', 'text-slate-400');
            activeBtn.classList.add('border-red-500', 'text-red-500');
        }

        // --- ÇİFT YÖNLÜ SENKRONİZASYON ---
        function syncUIFromSelection() {
            const active = canvas.getActiveObject();
            if (active && (active.type === 'i-text' || active.type === 'text')) {
                document.getElementById('fontFamily').value = active.fontFamily || 'Anton';
                document.getElementById('fontSizeSlider').value = active.fontSize || 80;
                document.getElementById('fontSizeVal').innerText = (active.fontSize || 80) + 'px';
                document.getElementById('charSpacingSlider').value = active.charSpacing || 0;
                document.getElementById('charSpacingVal').innerText = active.charSpacing || 0;
                if(active.fill) document.getElementById('textColor').value = active.fill;
                if(active.stroke) document.getElementById('strokeColor').value = active.stroke;
                if(active.strokeWidth !== undefined) {
                    document.getElementById('strokeWidthSlider').value = active.strokeWidth;
                    document.getElementById('strokeWidthVal').innerText = active.strokeWidth;
                }
            }
        }

        // --- METİN İŞLEMLERİ ---
        function addText() {
            const text = new fabric.IText('YENİ METİN', {
                left: TARGET_DIM.width / 2,
                top: TARGET_DIM.height / 2,
                fontFamily: 'Bebas Neue',
                fontSize: 80,
                fill: '#ffffff',
                stroke: '#000000',
                strokeWidth: 3,
                originX: 'center',
                originY: 'center'
            });
            canvas.add(text);
            canvas.setActiveObject(text);
        }

        function deselectObject() {
            canvas.discardActiveObject();
            canvas.renderAll();
        }

        function updateTextProperty(prop, value) {
            const active = canvas.getActiveObject();
            if (active && (active.type === 'i-text' || active.type === 'text')) {
                active.set(prop, value);
                canvas.renderAll();
            }
        }

        function toggleStyle(style) {
            const active = canvas.getActiveObject();
            if (active && (active.type === 'i-text' || active.type === 'text')) {
                if(style === 'bold') active.set('fontWeight', active.fontWeight === 'bold' ? 'normal' : 'bold');
                if(style === 'italic') active.set('fontStyle', active.fontStyle === 'italic' ? 'normal' : 'italic');
                if(style === 'underline') active.set('underline', !active.underline);
                canvas.renderAll();
            }
        }

        function applyGlow(color) {
            const active = canvas.getActiveObject();
            if (active) {
                if(!color) {
                    active.set('shadow', null);
                } else {
                    active.set('shadow', new fabric.Shadow({
                        color: color,
                        blur: 25,
                        offsetX: 0,
                        offsetY: 0
                    }));
                }
                canvas.renderAll();
            }
        }

        function moveText(dir) {
            const active = canvas.getActiveObject();
            if (!active) return;
            const step = 25;
            if (dir === 'left') active.left -= step;
            if (dir === 'right') active.left += step;
            if (dir === 'up') active.top -= step;
            if (dir === 'down') active.top += step;
            if (dir === 'center') {
                active.left = TARGET_DIM.width / 2;
                active.top = TARGET_DIM.height / 2;
            }
            active.setCoords();
            canvas.renderAll();
        }

        // --- GÖRSEL VE ARKA PLAN ---
        function setCanvasBg(url) {
            fabric.Image.fromURL(url, function(img) {
                img.set({
                    scaleX: TARGET_DIM.width / img.width,
                    scaleY: TARGET_DIM.height / img.height,
                    originX: 'left',
                    originY: 'top'
                });
                canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas));
            }, { crossOrigin: 'anonymous' });
        }

        function renderBgGallery() {
            const grid = document.getElementById('bgGalleryGrid');
            grid.innerHTML = '';
            HD_BACKGROUNDS.forEach(url => {
                const img = document.createElement('img');
                img.src = url;
                img.className = 'rounded-lg border border-slate-700 hover:border-red-500 cursor-pointer h-20 w-full object-cover transition';
                img.onclick = () => setCanvasBg(url);
                grid.appendChild(img);
            });
        }

        function handleImageUpload(e, type) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(f) {
                if(type === 'bg') {
                    setCanvasBg(f.target.result);
                } else {
                    fabric.Image.fromURL(f.target.result, function(img) {
                        img.scaleToWidth(380);
                        canvas.add(img);
                        canvas.centerObject(img);
                        canvas.setActiveObject(img);
                    });
                }
            };
            reader.readAsDataURL(file);
        }

        function deleteActiveObject() {
            const active = canvas.getActiveObject();
            if (active) {
                canvas.remove(active);
                canvas.discardActiveObject();
                canvas.renderAll();
            }
        }

        // --- ARAŞTIRMACI AI ARKA PLAN MOTORU ---
        async function generateAIImage() {
            const rawPrompt = document.getElementById('aiPrompt').value.trim();
            const style = document.getElementById('aiStyle').value;
            const isResearchEnabled = document.getElementById('aiResearchCheck').checked;

            if (!rawPrompt) return alert('Lütfen AI için bir konu veya anahtar kelime girin!');

            const btn = document.getElementById('btnGenerateAI');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-magnifying-glass fa-spin"></i> Bilgiler Araştırılıyor...';

            let enrichedKeywords = rawPrompt;

            if (isResearchEnabled) {
                try {
                    // Web/Wikipedia API üzerinden karakter ve konuyla ilgili arka plan görsel detaylarını çekme
                    const wikiRes = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(rawPrompt)}`);
                    if(wikiRes.ok) {
                        const data = await wikiRes.json();
                        if(data.extract) {
                            // Promptu zenginleştir
                            const keywords = data.extract.split(' ').slice(0, 10).join(' ');
                            enrichedKeywords += `, ${keywords}`;
                        }
                    }
                } catch(err) {
                    console.log('Arama desteği standart prompta geçti:', err);
                }
            }

            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> AI Arka Plan Üretiliyor...';

            const fullPrompt = `${enrichedKeywords}, ${style}`;
            const aiUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(fullPrompt)}?width=${TARGET_DIM.width}&height=${TARGET_DIM.height}&nologo=true&seed=${Math.floor(Math.random()*99999)}`;

            setCanvasBg(aiUrl);

            setTimeout(() => {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-bolt"></i> Bilgi Araştır & AI Arka Plan Üret';
            }, 3000);
        }

        // --- RASTGELE KAPAK MOTORU ---
        function generateRandomThumbnail() {
            canvas.clear();
            const randomBg = HD_BACKGROUNDS[Math.floor(Math.random() * HD_BACKGROUNDS.length)];
            setCanvasBg(randomBg);

            const word1 = RANDOM_WORDS[Math.floor(Math.random() * RANDOM_WORDS.length)];
            const word2 = RANDOM_WORDS[Math.floor(Math.random() * RANDOM_WORDS.length)];
            
            const fonts = ['Anton', 'Bebas Neue', 'Montserrat', 'Press Start 2P', 'Righteous', 'Cinzel', 'Luckiest Guy', 'Titan One', 'Rubik Glitch'];
            const colors = ['#facc15', '#ef4444', '#22c55e', '#38bdf8', '#ffffff', '#a855f7'];

            const title = new fabric.IText(`${word1}\n${word2}`, {
                left: TARGET_DIM.width / 2,
                top: TARGET_DIM.height / 2,
                fontFamily: fonts[Math.floor(Math.random() * fonts.length)],
                fontSize: 85,
                fill: colors[Math.floor(Math.random() * colors.length)],
                stroke: '#000000',
                strokeWidth: 4,
                textAlign: 'center',
                originX: 'center',
                originY: 'center'
            });

            canvas.add(title);
            canvas.setActiveObject(title);
        }

        // --- 30 ŞABLON MOTORU ---
        function render30Templates() {
            const grid = document.getElementById('templatesGrid');
            grid.innerHTML = '';

            TEMPLATES_DATA.forEach((tmpl, index) => {
                const card = document.createElement('div');
                card.className = 'bg-slate-950 border border-slate-800 hover:border-red-500 rounded-lg p-2 cursor-pointer flex flex-col justify-between h-20 transition relative overflow-hidden group';
                card.onclick = () => loadTemplate(index + 1);
                card.innerHTML = `
                    <img src="${tmpl.bg}" class="absolute inset-0 w-full h-full object-cover opacity-30 group-hover:opacity-50 transition">
                    <span class="text-[10px] font-bold text-slate-300 relative z-10">#${index+1} ${tmpl.name}</span>
                    <span class="text-xs font-black truncate relative z-10" style="color: ${tmpl.color}">${tmpl.text}</span>
                `;
                grid.appendChild(card);
            });
        }

        function loadTemplate(id) {
            canvas.clear();
            const tmpl = TEMPLATES_DATA[(id - 1) % TEMPLATES_DATA.length];
            setCanvasBg(tmpl.bg);

            const title = new fabric.IText(tmpl.text, {
                left: TARGET_DIM.width / 2,
                top: TARGET_DIM.height / 2,
                fontFamily: tmpl.font,
                fontSize: 85,
                fill: tmpl.color,
                stroke: '#000000',
                strokeWidth: 4,
                originX: 'center',
                originY: 'center'
            });

            canvas.add(title);
            canvas.setActiveObject(title);
        }

        // --- İNDİRME ---
        function downloadThumbnail() {
            canvas.setZoom(1);
            canvas.setDimensions({ width: TARGET_DIM.width, height: TARGET_DIM.height });

            const dataURL = canvas.toDataURL({ format: 'png', quality: 1.0 });

            resizeCanvasContainer();

            const link = document.createElement('a');
            link.download = `ThumbForge-16x9-${Date.now()}.png`;
            link.href = dataURL;
            link.click();
        }
    </script>
