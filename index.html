<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ThumbForge - Gelişmiş YouTube Kapak Oluşturucu</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fabric.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <!-- Google Fonts Entegrasyonu (Popüler YouTube Fontları) -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Bebas+Neue&family=Lobster&family=Montserrat:ital,wght@0,800;1,800&family=Oswald:wght@700&family=Pacifico&family=Permanent+Marker&family=Poppins:wght@700;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #0b0f19; color: #f8fafc; }
        .canvas-bg {
            background-color: #1e293b;
            background-image: radial-gradient(#334155 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 6px; }
    </style>
</head>
<body class="h-screen flex flex-col md:flex-row overflow-hidden select-none">

    <!-- SOL KONTROL PANELDİ -->
    <aside class="w-full md:w-[420px] bg-slate-900 border-r border-slate-800 flex flex-col h-[55vh] md:h-full z-20 shadow-2xl">
        
        <!-- Header & Boyut Değişimi -->
        <div class="p-3 border-b border-slate-800 flex items-center justify-between bg-slate-950">
            <h1 class="text-lg font-black tracking-wider text-red-500 flex items-center gap-2">
                <i class="fa-solid fa-fire text-orange-500"></i> ThumbForge
            </h1>
            <div class="flex bg-slate-800 p-1 rounded-lg border border-slate-700">
                <button id="btn169" onclick="changeRatio('16:9')" class="px-3 py-1 text-xs font-bold rounded-md bg-red-600 text-white transition">16:9 Yatay</button>
                <button id="btn916" onclick="changeRatio('9:16')" class="px-3 py-1 text-xs font-bold rounded-md text-slate-400 hover:text-white transition">9:16 Dikey</button>
            </div>
        </div>

        <!-- Menü Sekmeleri -->
        <div class="flex border-b border-slate-800 bg-slate-950 text-xs font-bold overflow-x-auto no-scrollbar">
            <button onclick="switchTab('ai')" id="tab-ai" class="flex-1 py-3 px-3 border-b-2 border-red-500 text-red-500 flex items-center justify-center gap-1.5 whitespace-nowrap"><i class="fa-solid fa-robot"></i> AI & Rastgele</button>
            <button onclick="switchTab('text')" id="tab-text" class="flex-1 py-3 px-3 border-b-2 border-transparent text-slate-400 hover:text-white flex items-center justify-center gap-1.5 whitespace-nowrap"><i class="fa-solid fa-font"></i> Metin</button>
            <button onclick="switchTab('image')" id="tab-image" class="flex-1 py-3 px-3 border-b-2 border-transparent text-slate-400 hover:text-white flex items-center justify-center gap-1.5 whitespace-nowrap"><i class="fa-solid fa-image"></i> Görsel/Galeri</button>
            <button onclick="switchTab('templates')" id="tab-templates" class="flex-1 py-3 px-3 border-b-2 border-transparent text-slate-400 hover:text-white flex items-center justify-center gap-1.5 whitespace-nowrap"><i class="fa-solid fa-layer-group"></i> 20 Şablon</button>
        </div>

        <!-- Sekme İçerikleri -->
        <div class="flex-1 overflow-y-auto p-4 space-y-4 text-xs">
            
            <!-- 1. AI & RASTGELE SEKMESİ -->
            <div id="sec-ai" class="space-y-4">
                <div class="bg-slate-800/80 p-3.5 rounded-xl border border-slate-700 space-y-2.5">
                    <label class="font-bold text-slate-200 flex items-center gap-2"><i class="fa-solid fa-wand-magic-sparkles text-red-400"></i> AI Yapay Zeka Arka Plan Motoru</label>
                    <textarea id="aiPrompt" rows="2" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-red-500" placeholder="Örn: Minecraft castle sunset, realistic lighting, 8k render..."></textarea>
                    
                    <div class="flex gap-2">
                        <select id="aiStyle" class="bg-slate-950 border border-slate-700 rounded-lg p-2 text-slate-300 w-full font-semibold">
                            <option value="">Stil Seçilmedi (Doğal)</option>
                            <option value="photorealistic, 8k, cinematic lighting">Sinematik / Gerçekçi</option>
                            <option value="cyberpunk style, neon lights, highly detailed">Cyberpunk / Neon</option>
                            <option value="anime style, studio ghibli, vibrant colors">Anime / Çizim</option>
                            <option value="3d render, blender render, isometric, sharp focus">3D Render / Oyun</option>
                        </select>
                    </div>

                    <button onclick="generateAIImage()" id="btnGenerateAI" class="w-full bg-gradient-to-r from-red-600 to-orange-600 hover:from-red-500 hover:to-orange-500 py-2.5 rounded-lg font-black text-white shadow-lg flex items-center justify-center gap-2">
                        <i class="fa-solid fa-bolt"></i> AI Görsel Üret & Arka Plan Yap
                    </button>
                </div>

                <div class="bg-slate-800/50 p-3.5 rounded-xl border border-slate-700 space-y-2">
                    <button onclick="generateRandomThumbnail()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl font-black text-sm flex items-center justify-center gap-2 shadow-lg transition">
                        <i class="fa-solid fa-dice"></i> 🎲 RASTGELE TASARIM OLUŞTUR
                    </button>
                    <p class="text-[11px] text-slate-400 text-center">Şablon dışı, tamamen dinamik rastgele renk, font, arka plan ve metin stili oluşturur!</p>
                </div>
            </div>

            <!-- 2. METİN SEKMESİ -->
            <div id="sec-text" class="hidden space-y-4">
                <button onclick="addText()" class="w-full bg-red-600 hover:bg-red-500 text-white py-2.5 rounded-lg font-bold flex items-center justify-center gap-2 shadow">
                    <i class="fa-solid fa-plus"></i> Tuval üzerine Yeni Metin Ekle
                </button>

                <!-- Seçili Metin Özellik Düzenleyicisi -->
                <div class="space-y-3 bg-slate-800/60 p-3.5 rounded-xl border border-slate-700">
                    <span class="font-bold text-slate-300 block border-b border-slate-700 pb-1"><i class="fa-solid fa-sliders"></i> Metin Biçimlendirme</span>
                    
                    <div>
                        <label class="text-[11px] font-bold text-slate-400 block mb-1">Yazı Tipi (Font)</label>
                        <select id="fontFamily" onchange="updateTextProperty('fontFamily', this.value)" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 font-bold text-white">
                            <option value="Anton">Anton (Bold/Gaming)</option>
                            <option value="Bebas Neue">Bebas Neue (YouTube Klasik)</option>
                            <option value="Montserrat">Montserrat (Kalın/Modern)</option>
                            <option value="Pacifico">Pacifico (Kursif/El Yazısı)</option>
                            <option value="Bangers">Bangers (Çizgi Roman/Eğlence)</option>
                            <option value="Permanent Marker">Permanent Marker (Grafiti)</option>
                            <option value="Lobster">Lobster (Süslü Kursif)</option>
                            <option value="Oswald">Oswald (Dik/Keskin)</option>
                        </select>
                    </div>

                    <div class="flex gap-1.5">
                        <button onclick="toggleStyle('bold')" class="flex-1 bg-slate-950 border border-slate-700 py-2 rounded font-black hover:bg-slate-800">B</button>
                        <button onclick="toggleStyle('italic')" class="flex-1 bg-slate-950 border border-slate-700 py-2 rounded italic hover:bg-slate-800">I</button>
                        <button onclick="toggleStyle('underline')" class="flex-1 bg-slate-950 border border-slate-700 py-2 rounded underline hover:bg-slate-800">U</button>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 block mb-1">Yazı Rengi</label>
                            <input type="color" id="textColor" onchange="updateTextProperty('fill', this.value)" value="#ffffff" class="w-full h-9 bg-slate-950 border border-slate-700 cursor-pointer rounded">
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 block mb-1">Arka Plan Rengi</label>
                            <input type="color" id="textBgColor" onchange="updateTextProperty('textBackgroundColor', this.value)" value="#000000" class="w-full h-9 bg-slate-950 border border-slate-700 cursor-pointer rounded">
                        </div>
                    </div>

                    <!-- Kenarlık (Stroke) & Gölge -->
                    <div class="space-y-2 pt-2 border-t border-slate-700">
                        <div class="flex items-center justify-between">
                            <label class="text-[11px] font-bold text-slate-400">Dış Çizgi Rengi</label>
                            <input type="color" onchange="updateTextProperty('stroke', this.value)" value="#000000" class="w-7 h-7 bg-transparent cursor-pointer rounded">
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 flex justify-between">
                                <span>Dış Çizgi Kalınlığı</span>
                                <span id="strokeWidthVal">2</span>
                            </label>
                            <input type="range" min="0" max="10" value="2" oninput="document.getElementById('strokeWidthVal').innerText=this.value; updateTextProperty('strokeWidth', parseInt(this.value))" class="w-full">
                        </div>
                    </div>
                </div>
            </div>

            <!-- 3. GÖRSEL & ARKA PLAN SEKMESİ -->
            <div id="sec-image" class="hidden space-y-4">
                <div class="bg-slate-800/60 p-3.5 rounded-xl border border-slate-700 space-y-3">
                    <span class="font-bold text-slate-300 block border-b border-slate-700 pb-1"><i class="fa-solid fa-mobile-screen"></i> Cihaz Galerisinden Fotoğraf Ekle</span>
                    
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <input type="file" id="bgLoader" accept="image/*" class="hidden" onchange="handleImageUpload(event, 'bg')">
                            <label for="bgLoader" class="w-full bg-slate-950 hover:bg-slate-800 border border-slate-700 p-3 rounded-lg font-bold text-center block cursor-pointer text-slate-300">
                                <i class="fa-solid fa-wallpaper text-red-500 block text-lg mb-1"></i>
                                Arka Plan Yap
                            </label>
                        </div>
                        <div>
                            <input type="file" id="overlayLoader" accept="image/*" class="hidden" onchange="handleImageUpload(event, 'overlay')">
                            <label for="overlayLoader" class="w-full bg-slate-950 hover:bg-slate-800 border border-slate-700 p-3 rounded-lg font-bold text-center block cursor-pointer text-slate-300">
                                <i class="fa-solid fa-layer-group text-blue-500 block text-lg mb-1"></i>
                                Üst Katman Ekle
                            </label>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="font-bold text-slate-300 block mb-2"><i class="fa-solid fa-images"></i> Hazır HD Arka Plan Galerisi</label>
                    <div class="grid grid-cols-2 gap-2 max-h-48 overflow-y-auto no-scrollbar">
                        <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600" onclick="setCanvasBg(this.src)" class="rounded-lg border border-slate-700 hover:border-red-500 cursor-pointer h-20 w-full object-cover">
                        <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=600" onclick="setCanvasBg(this.src)" class="rounded-lg border border-slate-700 hover:border-red-500 cursor-pointer h-20 w-full object-cover">
                        <img src="https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=600" onclick="setCanvasBg(this.src)" class="rounded-lg border border-slate-700 hover:border-red-500 cursor-pointer h-20 w-full object-cover">
                        <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?w=600" onclick="setCanvasBg(this.src)" class="rounded-lg border border-slate-700 hover:border-red-500 cursor-pointer h-20 w-full object-cover">
                        <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=600" onclick="setCanvasBg(this.src)" class="rounded-lg border border-slate-700 hover:border-red-500 cursor-pointer h-20 w-full object-cover">
                        <img src="https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=600" onclick="setCanvasBg(this.src)" class="rounded-lg border border-slate-700 hover:border-red-500 cursor-pointer h-20 w-full object-cover">
                    </div>
                </div>
            </div>

            <!-- 4. ŞABLONLAR SEKMESİ (20 ADET) -->
            <div id="sec-templates" class="hidden space-y-3">
                <span class="font-bold text-slate-300 block"><i class="fa-solid fa-border-all"></i> 20 Adet Özel Hazır Şablon</span>
                <div id="templatesGrid" class="grid grid-cols-2 gap-2 max-h-96 overflow-y-auto no-scrollbar">
                    <!-- 20 Şablon JavaScript tarafında dinamik üretilir -->
                </div>
            </div>

        </div>

        <!-- Katman Düzenleme & İndirme Barı -->
        <div class="p-3 border-t border-slate-800 bg-slate-950 flex flex-col gap-2">
            <div class="flex gap-2">
                <button onclick="bringForward()" class="flex-1 bg-slate-800 hover:bg-slate-700 py-1.5 rounded font-bold text-[11px] text-slate-300" title="Öne Getir"><i class="fa-solid fa-arrow-up"></i> Öne Al</button>
                <button onclick="sendBackward()" class="flex-1 bg-slate-800 hover:bg-slate-700 py-1.5 rounded font-bold text-[11px] text-slate-300" title="Arkaya Gönder"><i class="fa-solid fa-arrow-down"></i> Arkaya Al</button>
                <button onclick="deleteActiveObject()" class="bg-red-950 border border-red-800 text-red-400 px-3 py-1.5 rounded font-bold text-[11px] hover:bg-red-900" title="Seçileni Sil"><i class="fa-solid fa-trash"></i></button>
            </div>
            <button onclick="downloadThumbnail()" class="w-full bg-red-600 hover:bg-red-500 text-white font-black py-2.5 rounded-lg text-xs flex items-center justify-center gap-2 shadow-lg">
                <i class="fa-solid fa-download"></i> KAPAĞI YÜKSEK KALİTEDE İNDİR (HD)
            </button>
        </div>
    </aside>

    <!-- SAĞ/ORTA ÇALIŞMA ALANI (CANVAS) -->
    <main class="flex-1 canvas-bg p-4 relative flex items-center justify-center overflow-hidden">
        <div id="canvasParent" class="shadow-2xl border-2 border-slate-700 rounded-xl overflow-hidden flex items-center justify-center bg-black">
            <canvas id="c"></canvas>
        </div>
    </main>

    <!-- SKRİPT MANTIĞI -->
    <script>
        let canvas;
        let currentRatio = "16:9";

        const RATIOS = {
            "16:9": { width: 1280, height: 720 },
            "9:16": { width: 720, height: 1280 }
        };

        window.onload = function() {
            initCanvas();
            render20Templates();
            window.addEventListener('resize', resizeCanvasContainer);
        };

        function initCanvas() {
            const targetDim = RATIOS[currentRatio];
            canvas = new fabric.Canvas('c', {
                width: targetDim.width,
                height: targetDim.height,
                backgroundColor: '#0f172a',
                preserveObjectStacking: true
            });

            // Başlangıç Varsayılan Metni
            loadTemplate(1);
            resizeCanvasContainer();
        }

        function resizeCanvasContainer() {
            const wrapper = document.querySelector('main');
            const maxWidth = wrapper.clientWidth - 40;
            const maxHeight = wrapper.clientHeight - 40;

            const targetDim = RATIOS[currentRatio];
            const scale = Math.min(maxWidth / targetDim.width, maxHeight / targetDim.height);

            canvas.setDimensions({
                width: targetDim.width * scale,
                height: targetDim.height * scale
            });

            canvas.setZoom(scale);
        }

        function changeRatio(ratio) {
            currentRatio = ratio;
            document.getElementById('btn169').className = ratio === '16:9' ? 'px-3 py-1 text-xs font-bold rounded-md bg-red-600 text-white transition' : 'px-3 py-1 text-xs font-bold rounded-md text-slate-400 hover:text-white transition';
            document.getElementById('btn916').className = ratio === '9:16' ? 'px-3 py-1 text-xs font-bold rounded-md bg-red-600 text-white transition' : 'px-3 py-1 text-xs font-bold rounded-md text-slate-400 hover:text-white transition';

            canvas.clear();
            initCanvas();
        }

        function switchTab(tabName) {
            ['ai', 'text', 'image', 'templates'].forEach(t => {
                document.getElementById(`sec-${t}`).classList.add('hidden');
                const btn = document.getElementById(`tab-${t}`);
                btn.classList.remove('border-red-500', 'text-red-500');
                btn.classList.add('border-transparent', 'text-slate-400');
            });

            document.getElementById(`sec-${tabName}`).classList.remove('hidden');
            const activeBtn = document.getElementById(`tab-${tabName}`);
            activeBtn.classList.remove('border-transparent', 'text-slate-400');
            activeBtn.classList.add('border-red-500', 'text-red-500');
        }

        // --- METİN YÖNETİMİ ---
        function addText() {
            const dim = RATIOS[currentRatio];
            const text = new fabric.IText('YENİ METİN', {
                left: dim.width / 2,
                top: dim.height / 2,
                fontFamily: 'Bebas Neue',
                fontSize: 80,
                fill: '#ffffff',
                stroke: '#000000',
                strokeWidth: 2,
                originX: 'center',
                originY: 'center'
            });
            canvas.add(text);
            canvas.setActiveObject(text);
        }

        function updateTextProperty(prop, value) {
            const active = canvas.getActiveObject();
            if (active && (active.type === 'i-text' || active.type === 'text')) {
                active.set(prop, value);
                canvas.renderAll();
            }
        }

        function toggleStyle(style) {
            const active = canvas.getActiveObject();
            if (active && (active.type === 'i-text' || active.type === 'text')) {
                if(style === 'bold') active.set('fontWeight', active.fontWeight === 'bold' ? 'normal' : 'bold');
                if(style === 'italic') active.set('fontStyle', active.fontStyle === 'italic' ? 'normal' : 'italic');
                if(style === 'underline') active.set('underline', !active.underline);
                canvas.renderAll();
            }
        }

        // --- KATMAN & RESİM YÖNETİMİ ---
        function setCanvasBg(url) {
            fabric.Image.fromURL(url, function(img) {
                const targetDim = RATIOS[currentRatio];
                img.set({
                    scaleX: targetDim.width / img.width,
                    scaleY: targetDim.height / img.height,
                    originX: 'left',
                    originY: 'top'
                });
                canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas));
            }, { crossOrigin: 'anonymous' });
        }

        function handleImageUpload(e, type) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(f) {
                if(type === 'bg') {
                    setCanvasBg(f.target.result);
                } else {
                    fabric.Image.fromURL(f.target.result, function(img) {
                        img.scaleToWidth(350);
                        canvas.add(img);
                        canvas.centerObject(img);
                        canvas.setActiveObject(img);
                    });
                }
            };
            reader.readAsDataURL(file);
        }

        function bringForward() {
            const active = canvas.getActiveObject();
            if(active) canvas.bringForward(active);
        }

        function sendBackward() {
            const active = canvas.getActiveObject();
            if(active) canvas.sendBackwards(active);
        }

        function deleteActiveObject() {
            const active = canvas.getActiveObject();
            if (active) {
                canvas.remove(active);
                canvas.discardActiveObject();
                canvas.renderAll();
            }
        }

        // --- AI GÖRSEL ÜRETİMİ ---
        function generateAIImage() {
            const prompt = document.getElementById('aiPrompt').value.trim();
            const style = document.getElementById('aiStyle').value;
            if (!prompt) return alert('Lütfen AI için bir açıklama (prompt) girin!');

            const btn = document.getElementById('btnGenerateAI');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Yapay Zeka Üretiyor...';

            const fullPrompt = `${prompt} ${style}`;
            const targetDim = RATIOS[currentRatio];
            const aiUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(fullPrompt)}?width=${targetDim.width}&height=${targetDim.height}&nologo=true&seed=${Math.floor(Math.random()*9999)}`;

            setCanvasBg(aiUrl);

            setTimeout(() => {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-bolt"></i> AI Görsel Üret & Arka Plan Yap';
            }, 3500);
        }

        // --- 🎲 DİNAMİK RASTGELE KAPAK MOTORU ---
        function generateRandomThumbnail() {
            canvas.clear();
            const dim = RATIOS[currentRatio];

            // 1. Rastgele Arka Plan Rengi/Gradyanı
            const gradients = ['#0f172a', '#1e1b4b', '#450a0a', '#064e3b', '#312e81', '#831843'];
            canvas.setBackgroundImage(null, canvas.renderAll.bind(canvas));
            canvas.setBackgroundColor(gradients[Math.floor(Math.random()*gradients.length)], canvas.renderAll.bind(canvas));

            // 2. Rastgele Başlıklar ve Fontlar
            const titles = ['EFSANE BÖLÜM', 'GİZLİ YÖNTEM', 'SÖYLEMEDİLER!', '100 DAKİKA', 'DEV REHBER', 'İNANILMAZ!'];
            const fonts = ['Anton', 'Bebas Neue', 'Montserrat', 'Bangers', 'Pacifico', 'Permanent Marker'];
            const colors = ['#facc15', '#ef4444', '#22c55e', '#38bdf8', '#ffffff'];

            const text = new fabric.IText(titles[Math.floor(Math.random()*titles.length)], {
                left: dim.width / 2,
                top: dim.height / 2 - 30,
                fontFamily: fonts[Math.floor(Math.random()*fonts.length)],
                fontSize: Math.floor(Math.random() * 40) + 70,
                fill: colors[Math.floor(Math.random()*colors.length)],
                stroke: '#000000',
                strokeWidth: 4,
                originX: 'center',
                originY: 'center'
            });

            // 3. Rastgele İkinci Metin / Rozet
            const subText = new fabric.IText('🔥 TIKLA VE İZLE', {
                left: dim.width / 2,
                top: dim.height / 2 + 80,
                fontFamily: 'Montserrat',
                fontSize: 35,
                fill: '#ffffff',
                textBackgroundColor: '#ef4444',
                originX: 'center',
                originY: 'center'
            });

            canvas.add(text);
            canvas.add(subText);
            canvas.setActiveObject(text);
        }

        // --- 20 ADET GERÇEK ŞABLON MOTORU ---
        const TEMPLATES_DATA = [
            { name: "Gaming / Oyun", bg: "#0f172a", text: "EFSANE MAÇ!", font: "Anton", color: "#ef4444" },
            { name: "Vlog / Günlük", bg: "#831843", text: "BİR GÜNÜM!", font: "Pacifico", color: "#facc15" },
            { name: "Teknoloji", bg: "#1e1b4b", text: "SATIIN ALDIN!", font: "Montserrat", color: "#38bdf8" },
            { name: "Eğitim / Rehber", bg: "#064e3b", text: "0'DAN 100'E", font: "Bebas Neue", color: "#22c55e" },
            { name: "Soru & Cevap", bg: "#312e81", text: "SORULARINIZ!", font: "Bangers", color: "#ffffff" },
            { name: "Podcast", bg: "#18181b", text: "BÖLÜM #01", font: "Oswald", color: "#f43f5e" },

        function render20Templates() {
            const grid = document.getElementById('templatesGrid');
            grid.innerHTML = '';

            TEMPLATES_DATA.forEach((tmpl, index) => {
                const card = document.createElement('div');
                card.className = 'bg-slate-950 border border-slate-800 hover:border-red-500 rounded-lg p-2 cursor-pointer flex flex-col justify-between h-20 transition';
                card.onclick = () => loadTemplate(index + 1);
                card.innerHTML = `
                    <span class="text-[10px] font-bold text-slate-400">#${index+1} ${tmpl.name}</span>
                    <span class="text-xs font-black truncate" style="color: ${tmpl.color}">${tmpl.text}</span>
                `;
                grid.appendChild(card);
            });
        }

        function loadTemplate(id) {
            canvas.clear();
            const tmpl = TEMPLATES_DATA[(id - 1) % TEMPLATES_DATA.length];
            const dim = RATIOS[currentRatio];

            canvas.setBackgroundImage(null, canvas.renderAll.bind(canvas));
            canvas.setBackgroundColor(tmpl.bg, canvas.renderAll.bind(canvas));

            const title = new fabric.IText(tmpl.text, {
                left: dim.width / 2,
                top: dim.height / 2,
                fontFamily: tmpl.font,
                fontSize: 85,
                fill: tmpl.color,
                stroke: '#000000',
                strokeWidth: 3,
                originX: 'center',
                originY: 'center'
            });

            canvas.add(title);
            canvas.setActiveObject(title);
        }

        // --- YÜKSEK KALİTEDE İNDİRİCİ ---
        function downloadThumbnail() {
            const dim = RATIOS[currentRatio];

            canvas.setZoom(1);
            canvas.setDimensions({ width: dim.width, height: dim.height });

            const dataURL = canvas.toDataURL({
                format: 'png',
                quality: 1.0
            });

            resizeCanvasContainer();

            const link = document.createElement('a');
            link.download = `ThumbForge-${currentRatio}-${Date.now()}.png`;
            link.href = dataURL;
            link.click();
        }
    </script>
